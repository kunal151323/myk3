
version: 0.2

env:
  variables:
    S3_BUCKET: "myk3demobucket"
    CLOUDFRONT_ID: "E32VR49D4YR0FU"
    AWS_DEFAULT_REGION: "us-east-1"
    BUILD_FOLDER: "dist/my-angular-app"

phases:
  install:
    runtime-versions:
      nodejs: 18
    commands:
      - echo "Checking Node version"
      - node --version
      - npm --version
      - echo "Installing dependencies"
      - npm install --legacy-peer-deps

  build:
    commands:
      - echo "Starting Angular production build"
      - npm run build
      - echo "Checking build folder"
      - ls -lah dist/my-angular-app

  
  post_build:
    commands:
      - |
        if [ "$CODEBUILD_BUILD_SUCCEEDING" = "0" ]; then
          echo "BUILD FAILED. Skipping S3 deployment."
          exit 1
        fi
      - echo "Uploading files to S3"
      - aws s3 sync dist/my-angular-app/ s3://myk3demobucket/ --delete --region us-east-1
      - echo "Creating CloudFront invalidation"
      - aws cloudfront create-invalidation --distribution-id E32VR49D4YR0FU --paths "/*"
      - echo "Deployment completed successfully"


artifacts:
  files:
    - '**/*'
  base-directory: dist/my-angular-app
  discard-paths: no

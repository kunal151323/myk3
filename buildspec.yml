
version: 0.2

phases:
  install:
    runtime-versions:
      nodejs: 18
    commands:
      - echo "Installing dependencies"
      - npm install --legacy-peer-deps

  pre_build:
    commands:
      - echo "Checking Node version"
      - node --version
      - npm --version

    build:
    commands:
      - echo "Checking package.json build script"
      - npm pkg get scripts.build
      - echo "Checking Angular CLI installation"
      - npm ls @angular/cli
      - echo "Checking ng executable"
      - ls -l node_modules/.bin/ng
      - echo "Checking node_modules"
      - test -d node_modules && echo "node_modules exists" || echo "node_modules missing"
      - echo "Running Angular build"
      - npm run build

    post_build:
    commands:
      - echo "Checking build output"
      - |
        if [ ! -d "dist/my-angular-app" ]; then
          echo "ERROR: Build output folder does not exist!"
          echo "Available folders:"
          ls -la
          ls -la dist/ || true
          exit 1
        fi
      - echo "Checking AWS identity"
      - aws sts get-caller-identity
      - echo "Checking S3 bucket access"
      - aws s3 ls s3://myk3demobucket/ --region us-east-1
      - echo "Uploading files to S3"
      - aws s3 sync dist/my-angular-app/ s3://myk3demobucket/ --delete --region us-east-1
      - echo "Creating CloudFront invalidation"
      - aws cloudfront create-invalidation --distribution-id E32VR49D4YR0FU --paths "/*"ting CloudFront invalidation"
      - aws cloudfront create-invalidation --distribution-id E32VR49D4YR0FU --paths "/*"
      - echo "Deployment completed successfully"
